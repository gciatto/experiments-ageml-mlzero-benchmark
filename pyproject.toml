[tool.poetry]
name = "experiments-ageml-mlzero-benchmark"
packages = [
    { include = "ageml_mlzero_benchmark" },
]
version = "2.4.1"
description = "MLZero baseline experiments for the AGE-ML agentic AutoML comparison"
authors = ["Giovanni Ciatto <giovanni.ciatto@unibo.it>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">=3.12,<3.14"
pandas = "^3.0.0"
numpy = ">=1.26"
scikit-learn = "^1.5"
pyyaml = "^6.0"
matplotlib = "^3.9"
openml = ">=0.15"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^2.0.0"
poethepoet = "^0.49.0"
poetry = "^2.0.0"
pytest = "^9.0.0"
ruff = "^0.17.0"
types-pyyaml = "^6.0"

[tool.poetry.scripts]
ageml-bench = "ageml_mlzero_benchmark.cli:main"

[tool.pytest.ini_options]
markers = ["live: needs network, Docker, or LLM credentials (deselected by default)"]
addopts = "-m 'not live'"

[tool.mypy]
ignore_missing_imports = true

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy ageml_mlzero_benchmark tests"
compile = "python -m compileall ageml_mlzero_benchmark tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
